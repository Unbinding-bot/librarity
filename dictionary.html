?<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dictionary tool - Look up word definitions, pronunciations, and usage examples">
    <meta name="keywords" content="dictionary, definitions, pronunciation, word lookup, vocabulary">
    <title>Dictionary - Library Games</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/tools.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="book-loader">
            <div class="book-page"></div>
            <div class="book-page"></div>
            <div class="book-page"></div>
        </div>
        <p>Loading Dictionary...</p>
    </div>

    <!-- Main App Container -->
    <div id="app" style="display: none;">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="navbar-container flex-between">
                <div class="navbar-logo flex gap-md">
                    <span class="logo-text">
                        <span class="logo-library">Library</span>
                        <span class="logo-games">Games</span>
                    </span>
                </div>
                <nav class="navbar-nav flex gap-lg">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="#/games" class="nav-link">Games</a>
                    <a href="dictionary.html" class="nav-link active">Dictionary</a>
                    <a href="leaderboard.html" class="nav-link">Leaderboards</a>
                </nav>
                <div class="navbar-actions">
                    <div id="theme-toggle-container" class="nav-actions"></div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div id="dictionary-container">
                <!-- Dictionary tool will be rendered here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024 School Library Games. Educational tools for learning.</p>
            </div>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Application Scripts -->
    <script type="module">
        import Dictionary from './js/tools/dictionary.js';
        import { ThemeSystem } from './js/theme/theme-system.js';
        
        // Initialize theme system first
        const themeSystem = new ThemeSystem();
        themeSystem.init();
        window.themeSystem = themeSystem;
        
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', async () => {
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }, 500);
            
            // Initialize theme toggle
            if (window.themeSystem) {
                themeSystem.createToggleButton('theme-toggle-container');
            }
            
            // Initialize dictionary tool
            const dictionary = new Dictionary('dictionary-container');
            
            // Make dictionary accessible globally for testing
            window.dictionary = dictionary;
        });
        
        // Toast notification function
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const icon = {
                success: '�??',
                error: '�??',
                warning: '�?�',
                info: '�?�'
            }[type] || '�?�';
            
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-message">${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('toast-show'), 10);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                toast.classList.remove('toast-show');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        };
    </script>
</body>
</html>
