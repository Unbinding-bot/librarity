name: Deploy to GitHub Pages

on:
  # Runs on every push to main
  push:
    branches: [main]
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pre-render a real static page per route (and per live event,
      # fetched from Supabase) so link crawlers — facebookexternalhit,
      # Twitterbot, Discord — see a 200 response with per-page OG tags.
      # Facebook's crawler does not execute JavaScript, so the SPA's
      # dynamic <meta> updates never reach it without this step.
      - name: Pre-render route pages
        run: node scripts/prerender.mjs

      # GitHub Pages has no server-side routing, so a direct visit to
      # /librarity/leaderboard would 404. Copying index.html to 404.html
      # lets the SPA router handle unknown paths instead.
      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
